<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>ai-manager</title>
<style>
  body { font-family: sans-serif; margin: 2rem; color: #222; }
  #banner { background: #fee; border: 1px solid #c33; padding: 0.5rem 1rem; margin-bottom: 1rem; display: none; }
  .step { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; cursor: pointer; }
  .step.selected { border-color: #36c; background: #eef4ff; }
  .status { font-size: 0.8rem; padding: 0.1rem 0.5rem; border-radius: 4px; background: #ddd; }
  .status.in_progress { background: #ffe08a; }
  .status.done { background: #9be29b; }
  pre { background: #f6f6f6; padding: 0.75rem; white-space: pre-wrap; word-break: break-word; }
  #preview-log li { font-family: monospace; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>ai-manager</h1>
  <div id="banner"></div>

  <h2>ワークフロー</h2>
  <div id="steps"></div>

  <h2>生成されたプロンプト</h2>
  <pre id="prompt">ステップを選択してください</pre>

  <h2>プレビュー更新ログ</h2>
  <ul id="preview-log"></ul>

  <script src="client.js"></script>
</body>
</html>
